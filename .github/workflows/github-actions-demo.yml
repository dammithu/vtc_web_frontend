name: Vite React CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build Vite app
      run: npm run build

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.9
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        port: 22
        script: |
          cd /home/ubuntu/vtc-frontnew/vtc_web_frontend
          
          # Backup current build
          if [ -d dist ]; then
            mv dist dist_backup_$(date +%Y%m%d%H%M%S)
          fi
          
          # Remove old build and copy new build
          rm -rf dist
          mkdir -p dist
          rsync -avz --delete $GITHUB_WORKSPACE/dist/ ./dist/
          
          # Install serve globally if missing
          if ! command -v serve &> /dev/null; then
            npm install -g serve
          fi
          
          # Restart frontend with PM2
          pm2 stop moodlefront02 || true
          pm2 start serve --name "moodlefront02" -- -s /home/ubuntu/vtc-frontnew/vtc_web_frontend/dist -l 5173
          pm2 save
          pm2 status