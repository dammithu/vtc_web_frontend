name: Deploy React Vite App to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node 22 (matches EC2)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3️⃣ Install packages
      - name: Install Dependencies
        run: npm install

      # 4️⃣ Build Vite project
      - name: Build App
        run: npm run build

      # 5️⃣ Upload build to EC2
      - name: Copy Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ubuntu/vtc-frontnew/vtc_web_frontend"
          strip_components: 1

      # 6️⃣ Restart PM2 using NVM and serve
      - name: Restart PM2 App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Load NVM"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            nvm use 22

            # Restart by name or start if missing
            pm2 restart vtc-front || pm2 start $(which serve) --name vtc-front -- -s /home/ubuntu/vtc-frontnew/vtc_web_frontend -l 3000

            pm2 save
            pm2 status